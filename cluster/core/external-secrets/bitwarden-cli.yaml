---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitwarden-cli
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: bitwarden-cli
    app.kubernetes.io/instance: bitwarden-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-cli
      app.kubernetes.io/instance: bitwarden-cli
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitwarden-cli
        app.kubernetes.io/instance: bitwarden-cli
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitwarden-cli
          # renovate: datasource=docker depName=ghcr.io/charlesthomas/bitwarden-cli
          image: ghcr.io/charlesthomas/bitwarden-cli:2026.6.0@sha256:f8da73df51c6614b1439991a99132e3f1dfe3526a64978392650e72e82400398
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              # The appdata emptyDir has pod lifetime, so a restarted container
              # finds authenticated state from the previous run. `bw config
              # server` and `bw login` both refuse to run in that state, which
              # made any single restart permanently fatal. Clear it first.
              bw logout >/dev/null 2>&1 || true
              bw config server "$${BW_HOST}"
              bw login --apikey --raw >/dev/null
              export BW_SESSION="$(bw unlock --passwordenv BW_PASSWORD --raw)"
              bw unlock --check
              exec bw serve --hostname all
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: HOME
              value: /bitwarden
            - name: BITWARDENCLI_APPDATA_DIR
              value: /bitwarden/data
            - name: BW_HOST
              valueFrom:
                secretKeyRef:
                  name: bitwarden-cli
                  key: BW_HOST
            - name: BW_CLIENTID
              valueFrom:
                secretKeyRef:
                  name: bitwarden-cli
                  key: BW_CLIENTID
            - name: BW_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: bitwarden-cli
                  key: BW_CLIENTSECRET
            - name: BW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bitwarden-cli
                  key: BW_PASSWORD
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 1
          readinessProbe:
            tcpSocket:
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          # Liveness must not depend on Bitwarden's cloud being reachable and
          # fast. The previous probe POSTed /sync?force=true, so three slow
          # upstream syncs in a six-minute window killed the container. Vault
          # refresh now lives in the vault-sync sidecar, where failure is
          # non-fatal.
          livenessProbe:
            httpGet:
              path: /status
              port: http
            failureThreshold: 3
            periodSeconds: 120
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: appdata
              mountPath: /bitwarden
            - name: tmp
              mountPath: /tmp
        # Refreshes the served vault cache so new and rotated Bitwarden items
        # become visible to ESO. This was previously a side effect of the
        # liveness probe; here a failed sync retries instead of killing the pod.
        - name: vault-sync
          # renovate: datasource=docker depName=ghcr.io/charlesthomas/bitwarden-cli
          image: ghcr.io/charlesthomas/bitwarden-cli:2026.6.0@sha256:f8da73df51c6614b1439991a99132e3f1dfe3526a64978392650e72e82400398
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              while true; do
                sleep 600
                wget --quiet --output-document=/dev/null --post-data= \
                  "http://127.0.0.1:8087/sync?force=true" || true
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: appdata
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: bitwarden-cli
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: bitwarden-cli
    app.kubernetes.io/instance: bitwarden-cli
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bitwarden-cli
    app.kubernetes.io/instance: bitwarden-cli
  ports:
    - name: http
      port: 8087
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-secrets-to-bitwarden-cli
  namespace: external-secrets
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bitwarden-cli
      app.kubernetes.io/instance: bitwarden-cli
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
              app.kubernetes.io/instance: external-secrets
      ports:
        - port: 8087
          protocol: TCP
