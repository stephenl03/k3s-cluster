---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/rancher/system-upgrade-controller?ref=v0.19.2
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.19.2
patches:
  - target:
      kind: ClusterRoleBinding
      name: system-upgrade
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: system-upgrade
        annotations:
          kustomize.toolkit.fluxcd.io/force: enabled
  - target:
      kind: Deployment
      name: system-upgrade-controller
      namespace: system-upgrade
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: system-upgrade-controller
        namespace: system-upgrade
        annotations:
          kustomize.toolkit.fluxcd.io/force: enabled
