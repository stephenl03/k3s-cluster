---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nzbget
  namespace: media
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://bjw-s-labs.github.io/helm-charts/
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      nzbget:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/nzbget
              tag: latest
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                memory: 300Mi
                cpu: 100m
              limits:
                memory: 4000Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: 6789
    ingress:
      app:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
          hajimari.io/enable: "true"
          hajimari.io/icon: download-box
          hajimari.io/group: Media
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - host: &host "{{ .Release.Name }}.k8s.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
            secretName: nzbget-tls
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /config
      downloads:
        existingClaim: nzbget-downloads
        globalMounts:
          - path: /downloads
