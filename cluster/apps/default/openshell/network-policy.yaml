---
# The gateway runs plaintext with unauthenticated users (see helm-release.yaml);
# the auth boundary is Traefik's client-cert check (lan-access.yaml). Ingress
# is limited to pods in this namespace (sandboxes, supervisor, peers) and the
# k3s Traefik pods on the gateway port. kubectl port-forward enters via the
# pod's own network namespace and kubelet probes come from the node, neither of
# which this policy blocks.
# k3s kube-router enforces NetworkPolicy here (verified 2026-11-04).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8080
