---
# Gateway ingress: pods in this namespace (sandboxes, supervisors, peers) plus
# the home LAN 172.16.10.0/24 on the gateway port via service-lan.yaml. The
# LAN path is HTTPS with mandatory client certs (see helm-release.yaml); the
# rest of the cluster stays blocked. kubectl port-forward enters via the pod's
# own network namespace and kubelet probes come from the node, neither of which
# this policy blocks.
# k3s kube-router enforces NetworkPolicy here (verified 2026-11-04).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openshell-gateway-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openshell
      app.kubernetes.io/instance: openshell
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - ipBlock:
            cidr: 172.16.10.0/24
      ports:
        - protocol: TCP
          port: 8080
