---
# NVIDIA OpenShell gateway. Chart is published to GHCR as OCI only, so use
# OpenShell's own OCIRepository + chartRef (same pattern as buzz).
# Requires the Agent Sandbox controller/CRD from cluster/core/agent-sandbox.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openshell
spec:
  interval: 15m
  url: oci://ghcr.io/nvidia/openshell/helm-chart
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "0.1.7"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openshell
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    # A failed first install must stay put for inspection: an uninstall would
    # discard the generated PKI and the SQLite PVC.
    timeout: 10m
    remediation:
      retries: 0
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    server:
      telemetryEnabled: false
      # Both immutable after install (StatefulSet volumeClaimTemplate).
      dataStorageClass: longhorn
      dataStorageSize: 2Gi
      workspaceStorageClass: longhorn
      workspaceDefaultStorageSize: 5Gi
      # Access model (2026-11-05): the gateway stays plaintext h2c on its
      # ClusterIP Service. Traefik terminates TLS (ALPN h2, Let's Encrypt) for
      # openshell.k8s.${SECRET_DOMAIN} and REQUIRES a client certificate from
      # the openshell-lan CA (lan-access.yaml), then forwards h2c here.
      # Unauthenticated users are accepted because the Traefik client-cert
      # check is the auth boundary; network-policy.yaml only lets Traefik and
      # pods in this namespace reach the gateway. kubectl port-forward still
      # works for break-glass access. Do not expose this Service any other way.
      disableTls: true
    gatewayConfig:
      openshell:
        version: 2
      openshell.gateway.auth:
        allow_unauthenticated_users: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
