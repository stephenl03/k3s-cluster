---
# NVIDIA OpenShell gateway. Chart is published to GHCR as OCI only, so use
# OpenShell's own OCIRepository + chartRef (same pattern as buzz).
# Requires the Agent Sandbox controller/CRD from cluster/core/agent-sandbox.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openshell
spec:
  interval: 15m
  url: oci://ghcr.io/nvidia/openshell/helm-chart
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "0.1.7"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openshell
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    # A failed first install must stay put for inspection: an uninstall would
    # discard the generated PKI and the SQLite PVC.
    timeout: 10m
    remediation:
      retries: 0
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 2
  values:
    server:
      telemetryEnabled: false
      # Both immutable after install (StatefulSet volumeClaimTemplate).
      dataStorageClass: longhorn
      dataStorageSize: 2Gi
      workspaceStorageClass: longhorn
      workspaceDefaultStorageSize: 5Gi
      # Access model (2026-11-05): HTTPS + mTLS on the home LAN only.
      # service-lan.yaml exposes the gateway on a MetalLB IP restricted to
      # 172.16.10.0/24 as openshell.k8s.${SECRET_DOMAIN}. The gateway terminates
      # TLS itself and requires a client cert signed by the chart CA
      # (openshell-client-tls); with a client CA and no OIDC issuer the gateway
      # maps the verified cert to a user (mTLS auth defaults on).
      disableTls: false
      tls:
        enableMtls: true
    # cert-manager owns TLS (the certgen hook then only makes the JWT keys).
    # Two server certs, picked by SNI: an internal one from the chart's own CA
    # for in-cluster names (supervisor callbacks verify it against that CA), and
    # an external Let's Encrypt one (DNS-01 via Cloudflare) for the LAN
    # hostname, so the CLI's server verification uses public roots.
    # Never point grpc_endpoint at the external hostname.
    certManager:
      enabled: true
      serverIssuerRef:
        name: letsencrypt-production
        kind: ClusterIssuer
        group: cert-manager.io
      serverDnsNames:
        - openshell.k8s.${SECRET_DOMAIN}
    gatewayConfig:
      openshell:
        version: 2
      # Unauthenticated users are now rejected: a CLI without a valid client
      # cert gets nothing.
      openshell.gateway.auth:
        allow_unauthenticated_users: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
