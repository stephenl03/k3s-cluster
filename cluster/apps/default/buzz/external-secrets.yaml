---
# Single Secret consumed by three things at once:
#   - the buzz relay          (secrets.existingSecret)
#   - the bundled postgres    (postgresql.auth.existingSecret)
#   - the bundled redis       (redis.auth.existingSecret)
# The subcharts read `postgres-password` / `redis-password`; the relay reads the
# composed DATABASE_URL / REDIS_URL. Both must agree byte-for-byte, so the URLs
# are templated from the same fetched values rather than stored separately.
#
# NOTE: generate these passwords as alphanumeric-only in Bitwarden. They are
# interpolated into URL userinfo unencoded, so `@`, `/`, `:` or `#` would
# corrupt the connection string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: buzz-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: buzz-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .pgPassword }}"
        redis-password: "{{ .redisPassword }}"
        DATABASE_URL: "postgres://buzz:{{ .pgPassword }}@buzz-postgresql.buzz.svc.cluster.local:5432/buzz"
        REDIS_URL: "redis://:{{ .redisPassword }}@buzz-redis.buzz.svc.cluster.local:6379"
        BUZZ_RELAY_PRIVATE_KEY: "{{ .relayPrivateKey }}"
        BUZZ_GIT_HOOK_HMAC_SECRET: "{{ .gitHookHmac }}"
        BUZZ_S3_ACCESS_KEY: "{{ .s3AccessKey }}"
        BUZZ_S3_SECRET_KEY: "{{ .s3SecretKey }}"
  data:
    # TODO(stephen): replace each key with the Bitwarden item UUID from its
    # web-vault URL. See cluster/core/external-secrets/README.md.
    - secretKey: pgPassword
      remoteRef:
        key: 33e58f98-2929-4cca-83d0-b4980002f93a
        property: password
    - secretKey: redisPassword
      remoteRef:
        key: 94855697-d2e0-4848-9661-b49800030d37
        property: password
    # 64 lowercase hex chars. Rotating this changes the relay's identity.
    - secretKey: relayPrivateKey
      remoteRef:
        key: 23805fe9-897d-4d30-8b3f-b49800030d76
        property: password
    # Minimum 32 chars; the relay hard-errors below that.
    - secretKey: gitHookHmac
      remoteRef:
        key: dc85ebaa-fe7b-4bfb-b648-b49800030db4
        property: password
    - secretKey: s3AccessKey
      remoteRef:
        key: af13dc18-554f-49c2-96e6-b49800030e0a
        property: username
    - secretKey: s3SecretKey
      remoteRef:
        key: af13dc18-554f-49c2-96e6-b49800030e0a
        property: password
---
# Separate Secret for RustFS itself. It CANNOT share buzz-secrets: the chart
# wires credentials with `envFrom.secretRef` over the whole Secret, so every
# key becomes an environment variable — buzz-secrets would leak DATABASE_URL,
# the relay private key and the git HMAC into the object store's environment.
# Same Bitwarden item as buzz-secrets' S3 keys, so the two always agree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: rustfs-credentials
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: af13dc18-554f-49c2-96e6-b49800030e0a
        property: username
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: af13dc18-554f-49c2-96e6-b49800030e0a
        property: password
