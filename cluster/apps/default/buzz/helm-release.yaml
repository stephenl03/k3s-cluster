---
# Buzz publishes its chart to GHCR as an OCI artifact only — there is no classic
# HTTP Helm repo, so this is the first OCIRepository in the cluster. Flux docs
# put `HelmRepository` with `spec.type: oci` in maintenance mode (its
# spec.interval is silently ignored), so use OCIRepository + chartRef instead.
# Upstream's own examples/flux-helmrelease.yaml uses the deprecated form AND
# pins a chart version that does not exist — do not copy it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: buzz
spec:
  interval: 15m
  url: oci://ghcr.io/block/buzz/charts/buzz
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "0.1.8"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app buzz
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    # The relay's S3 conformance probe is startup-fatal, so object storage has
    # to exist before the relay starts.
    - name: rustfs
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    # The relay is only Ready after it passes a startup S3 CAS probe, so a
    # genuine failure never resolves by retrying. The house default of
    # remediation.retries: 5 turned that into an uninstall/reinstall loop that
    # tore down Postgres mid-initdb every 5 minutes and masked the real error.
    # Fail once and stay put so the pod can be inspected.
    timeout: 15m
    remediation:
      retries: 0
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 2
  # The chart HARDCODES strategy RollingUpdate/maxSurge 1/maxUnavailable 0 in
  # templates/deployment.yaml with no value to override it. That deadlocks
  # against the ReadWriteOnce git PVC: the new pod cannot attach the volume
  # until the old one releases it, and maxUnavailable 0 will not release the
  # old one until the new pod is Ready. Earlier upgrades only survived by
  # chance, when the replacement happened to land on the node already holding
  # the volume; a cross-node reschedule hangs forever on Multi-Attach error.
  # Recreate is the correct strategy for a single-replica RWO deployment.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: buzz
            patch: |
              - op: replace
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    replicaCount: 1
    # Single canonical hostname, resolved identically inside and outside: one
    # public proxied CNAME onto the cloudflared tunnel, no split-horizon entry.
    # The relay is multi-tenant and keys the tenant off `communities.host`,
    # which holds exactly ONE host per community — so it can serve only one
    # name, and that name has to be the externally reachable one. The row was
    # updated to buzz.${SECRET_DOMAIN} in place, preserving the community id
    # and its relay_members.
    #
    # This value only supplies the ws/wss scheme to NIP-42 verification;
    # nip42_expected_relay_url builds the expected URL from the arrival host,
    # not from here. Kept in sync anyway so the two never read as disagreeing.
    relayUrl: "wss://buzz.${SECRET_DOMAIN}"
    # Stephen's Nostr pubkey — the relay operator/owner.
    # npub1v9eecmzgzwgqvemjlknv6s6e2l8fkfhk5hgrjejf7qnshrtajq2qute8yq
    # Required while relay.requireRelayMembership is true (the default, and
    # what we want — false makes the relay open to anyone).
    ownerPubkey: "61739c6c481390066772fda6cd435957ce9b26f6a5d0396649f0270b8d7d9014"

    image:
      # The chart's appVersion is a stale 0.1.0, and image.tag defaults to ""
      # which falls back to it — so this MUST be pinned or you silently run a
      # relay two releases old.
      #
      # 0.2.1, not 0.2.0: the chart's pairing-relay template execs
      # /usr/local/bin/buzz-pair-relay, and that binary does not exist in the
      # 0.2.0 image (which ships only buzz-admin and buzz-relay), so the
      # pairing pod died with exit 128 / StartError before running any code.
      # 0.2.1 ships it. Verified identical digest to :latest —
      # sha256:4e31b7c7abb7d00b6f513dc559e58d2b980416f1dc400aa01bcf762cf2989cfc
      # One image serves both Deployments; there is no pairingRelay.image
      # override, so the main relay necessarily moves with it.
      tag: "0.2.1"
      pullPolicy: IfNotPresent

    secrets:
      existingSecret: buzz-secrets

    relay:
      # Restricts NIP-42 pubkey-only connections to pubkeys present in the
      # `pubkey_allowlist` TABLE — this flag is only the on/off switch, the
      # allowlist itself lives in Postgres. Enabling it against an empty table
      # locks out every pubkey-only client, so the owner key was inserted
      # first. Note pubkey_allowlist.pubkey is BYTEA (relay_members.pubkey is
      # TEXT), so rows must be written with decode(<hex>,'hex') or you silently
      # store the ASCII of the hex string and match nothing.
      # Holders of a valid API token bypass the allowlist entirely.
      pubkeyAllowlist: true

      extraEnv:
        # The startup CAS probe defaults to 32 concurrent writers against a
        # single key. RustFS answers those correctly (verified: it returns
        # HTTP 412 for losing racers) but serializes them on a per-object
        # namespace lock, taking ~5s per contended PUT and then shedding load
        # with 503 — which fails the probe. 8 still exercises real contention
        # and is far beyond anything this relay will see in practice.
        - name: BUZZ_GIT_PROBE_WRITERS
          value: "8"
      podAnnotations:
        # The chart's own checksum/secret annotation hashes the chart-managed
        # Secret, which does not render when existingSecret is set — so a
        # rotated credential would never roll the pods without this.
        secret.reloader.stakater.com/reload: buzz-secrets

    postgresql:
      enabled: true
      auth:
        database: buzz
        username: buzz
        # Must be overridden: the chart's default points at a chart-managed
        # Secret that is not rendered when secrets.existingSecret is set.
        existingSecret: buzz-secrets
        secretKeys:
          adminPasswordKey: postgres-password
      persistence:
        enabled: true
        size: 20Gi
        storageClass: longhorn
      image:
        imagePullPolicy: IfNotPresent

    redis:
      enabled: true
      auth:
        existingSecret: buzz-secrets
        existingSecretPasswordKey: redis-password
      persistence:
        enabled: true
        size: 4Gi
        storageClass: longhorn
      image:
        pullPolicy: IfNotPresent

    # Bundled MinIO is mutually exclusive with secrets.existingSecret (hard
    # template failure), and its PVC cannot be given a storageClass at all.
    # RustFS runs alongside instead — see rustfs.yaml.
    minio:
      enabled: false
    s3:
      # Note the "-svc" suffix: the RustFS chart hard-codes it on the Service
      # name and there is no value to remove it.
      endpoint: "http://rustfs-svc.buzz.svc.cluster.local:9000"
      bucket: buzz-media
      # Promoted from a raw BUZZ_S3_ADDRESSING_STYLE extraEnv now that chart
      # 0.1.8 exposes it. `path` is both the chart default and the relay's
      # compiled default; pinning it explicitly means a future default flip
      # can't silently break RustFS, whose DNS resolves only the endpoint
      # host, not <bucket>.<endpoint>.
      addressingStyle: path

    persistence:
      git:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 10Gi

    # No-op at replicaCount 1 (the template already gates on >1 replicas), but
    # explicit so a future scale-up doesn't silently start blocking node drains.
    podDisruptionBudget:
      enabled: false

    # ── Device pairing relay ────────────────────────────────────────────────
    # Off by default in the chart. Without it the relay publishes no pairing
    # URL in NIP-11, so Buzz clients fall back to the legacy same-host /pair
    # convention and the QR-code flow 404s. `url` is mandatory when enabled
    # (_validate.tpl hard-fails otherwise); it is injected into the main relay
    # as BUZZ_PAIRING_RELAY_URL and is what clients actually dial.
    #
    # The chart renders only a ClusterIP Service for this — its ingress
    # template has no pairing branch — so external routing is added by hand in
    # pairing-ingress.yaml. A dedicated host avoids a StripPrefix middleware,
    # since the standalone buzz-pair-relay serves its own root, not /pair.
    pairingRelay:
      enabled: true
      # Public tunnel hostname, not the internal one. This value is what the
      # relay publishes as pairing_relay_url in NIP-11, and NIP-11 has exactly
      # one slot -- an internal-only name would be unreachable for a phone off
      # the LAN. Resolves through Cloudflare from anywhere; the LAN hairpin is
      # irrelevant for a brief one-shot pairing exchange.
      url: "wss://buzz-pair.${SECRET_DOMAIN}"

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # No proxy-timeout annotations: upstream's examples are nginx-specific.
      # The relay pings every 30s, well inside Traefik's 180s idleTimeout.
      # Both the LAN name and the public tunnel name. cloudflared forwards the
      # ORIGINAL Host header (buzz.${SECRET_DOMAIN}), so Traefik needs a router
      # for it or every tunnelled request 404s at the origin. Rewriting the Host
      # to the internal name would fix routing but break NIP-42: the relay
      # derives the expected AUTH relay URL from the host the connection arrived
      # on, so the rewritten name would no longer match what the client signed.
      hosts:
        - host: &host "buzz.k8s.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
        - host: &pubhost "buzz.${SECRET_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host
            - *pubhost
          secretName: buzz-tls
