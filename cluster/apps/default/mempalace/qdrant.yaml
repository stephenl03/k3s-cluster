---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qdrant
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://qdrant.github.io/qdrant-helm
      chart: qdrant
      version: 1.18.2
      sourceRef:
        kind: HelmRepository
        name: qdrant-charts
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
  values:
    replicaCount: 1
    config:
      cluster:
        enabled: false
      service:
        enable_tls: false
    env:
      - name: QDRANT__SERVICE__API_KEY
        valueFrom:
          secretKeyRef:
            name: qdrant-api-key
            key: api-key
    podAnnotations:
      secret.reloader.stakater.com/reload: qdrant-api-key
    persistence:
      storageClassName: longhorn
      size: 10Gi
    snapshotPersistence:
      enabled: true
      storageClassName: longhorn
      size: 10Gi
    livenessProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    startupProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
