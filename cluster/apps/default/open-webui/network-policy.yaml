---
# Only the k3s Traefik pods may reach the Open WebUI HTTP port. Egress is left
# open (no default-deny in this cluster): Open WebUI needs DNS, the internet
# for web search/fetch and model metadata, and the Mac Studio llama.cpp server
# at 172.16.10.56:8000. kubelet probes come from the node and are not blocked.
# k3s kube-router enforces NetworkPolicy here (verified 2026-11-04).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-to-open-webui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: open-webui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8080
