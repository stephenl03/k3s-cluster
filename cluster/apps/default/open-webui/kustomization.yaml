---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: open-webui
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - helm-release.yaml
  - network-policy.yaml
# ComfyUI txt2img workflow for image generation (fed to COMFYUI_WORKFLOW /
# COMFYUI_WORKFLOW_NODES). Fixed name because the HelmRelease references it;
# Reloader rolls the pod when it changes.
configMapGenerator:
  - name: open-webui-comfyui-workflow
    files:
      - comfyui-workflow.json
      - comfyui-workflow-nodes.json
    options:
      disableNameSuffixHash: true
