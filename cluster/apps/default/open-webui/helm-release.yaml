---
# Open WebUI chat front end for the Mac Studio llama.cpp server.
# Chart is published to GHCR as OCI, so use OCIRepository + chartRef.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: open-webui
spec:
  interval: 15m
  url: oci://ghcr.io/open-webui/helm-charts/open-webui
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: "18.0.0"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: 0.13.3@sha256:46b59158e6558eeb980bc828e0f1b30238ad24d82ed84d5e5eda1dab2a082f14
    annotations:
      reloader.stakater.com/auto: "true"
    ollama:
      enabled: false
    pipelines:
      enabled: false
    tika:
      enabled: false
    # Single replica: in-memory websocket manager, no bundled Redis.
    websocket:
      enabled: true
      manager: ""
      redis:
        enabled: false
    # Mac Studio llama.cpp server (OpenAI-compatible, model alias "qwen").
    # Key comes from the SOPS-encrypted open-webui-secret (secrets.sops.yaml).
    enableOpenaiApi: true
    openaiBaseApiUrl: "http://172.16.10.56:8000/v1"
    openaiApiKey: ""
    openaiApiKeyExistingSecret: open-webui-secret
    openaiApiKeyExistingSecretKey: OPENAI_API_KEY
    extraEnvVars:
      - name: WEBUI_URL
        value: "https://openwebui.k8s.${SECRET_DOMAIN}"
      # Stable session signing key (otherwise regenerated on pod restart).
      - name: WEBUI_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: open-webui-secret
            key: WEBUI_SECRET_KEY
      - name: TZ
        value: "${TIMEZONE}"
      # Web search via the in-cluster SearXNG (cluster/apps/default/searxng).
      # PersistentConfig: 0.13.x seeds every config key into the DB on first
      # boot, so these only apply to a fresh DB; afterwards the DB value (and
      # anything saved in Admin > Settings > Web Search) wins over env.
      - name: ENABLE_WEB_SEARCH
        value: "true"
      - name: WEB_SEARCH_ENGINE
        value: searxng
      - name: SEARXNG_QUERY_URL
        value: "http://searxng.searxng.svc.cluster.local:8080/search?q=<query>"
      # Image generation via ComfyUI on fedora (comfyui-nvidia, RTX 3070).
      # Z-Image Turbo: 8 steps, cfg 1, ~15 s per 1024x1024 image. Same
      # PersistentConfig caveat as web search: env only seeds a fresh DB.
      # Workflow + node mapping live in comfyui-workflow*.json (ConfigMap).
      - name: ENABLE_IMAGE_GENERATION
        value: "true"
      - name: IMAGE_GENERATION_ENGINE
        value: comfyui
      - name: COMFYUI_BASE_URL
        value: "http://fedora.lazy.sh:8189"
      - name: IMAGE_GENERATION_MODEL
        value: "Z-Image/z_image_turbo_bf16.safetensors"
      - name: IMAGE_SIZE
        value: "1024x1024"
      - name: IMAGE_STEPS
        value: "8"
      - name: COMFYUI_WORKFLOW
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: comfyui-workflow.json
      - name: COMFYUI_WORKFLOW_NODES
        valueFrom:
          configMapKeyRef:
            name: open-webui-comfyui-workflow
            key: comfyui-workflow-nodes.json
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi
    ingress:
      enabled: true
      class: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      host: "openwebui.k8s.${SECRET_DOMAIN}"
      tls: true
      existingSecret: open-webui-tls
    # Chart sets no probes by default, so the pod went Ready while the app
    # was still downloading its embedding model and Traefik returned 502.
    # startupProbe allows ~10 min (60 x 10s) for first boot.
    startupProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /health
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 5
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
