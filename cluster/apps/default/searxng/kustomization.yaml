---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: searxng
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - searxng.yaml
  - network-policy.yaml
# Hash-suffixed ConfigMap so a settings change rolls the pod.
configMapGenerator:
  - name: searxng-settings
    files:
      - settings.yml
