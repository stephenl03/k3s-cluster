---
# SearXNG metasearch, LAN-only at searxng.k8s.${SECRET_DOMAIN}. Also the web
# search backend for Open WebUI (in-cluster via the Service). Migrated from the
# fedora podman POC. Stateless: settings come from the generated ConfigMap,
# secrets from searxng-secret (SOPS), cache is an emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: searxng
  annotations:
    secret.reloader.stakater.com/reload: searxng-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
      app.kubernetes.io/instance: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/instance: searxng
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # searxng user/group baked into the image.
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # settings.yml has no env substitution, so render the Brave API key
        # into a writable copy of the ConfigMap. The entrypoint leaves an
        # existing /etc/searxng/settings.yml alone.
        - name: render-settings
          image: docker.io/searxng/searxng:2026.11.11-626105eec@sha256:606fc8852a53f0be4ac05116950ff480f6f56b8ef7d77b366868cc76478036e5  # yamllint disable-line rule:line-length
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              sed "s|__BRAVE_API_KEY__|$${BRAVE_API_KEY}|" \
                /settings-template/settings.yml > /etc/searxng/settings.yml
          env:
            - name: BRAVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: BRAVE_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: settings-template
              mountPath: /settings-template
              readOnly: true
            - name: config
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:2026.11.11-626105eec@sha256:606fc8852a53f0be4ac05116950ff480f6f56b8ef7d77b366868cc76478036e5  # yamllint disable-line rule:line-length
          env:
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secret
                  key: SEARXNG_SECRET
            # Image default is "::"; bind IPv4 explicitly.
            - name: GRANIAN_HOST
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/searxng
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: settings-template
          configMap:
            name: searxng-settings
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/instance: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: &host "searxng.k8s.${SECRET_DOMAIN}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port:
                  name: http
  tls:
    - hosts:
        - *host
      secretName: searxng-tls
